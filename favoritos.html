<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVerse</title>
    <link rel="stylesheet" href="cards.css">
</head>

<body>
    <!--CABEÇALHO-->
    <div class="area-cabeçalho">
        <h1 class="titulo"><b>GAME<span class="vermelho">VERSE</span></b></h1>
        <a href="cards.html" class="cabeçalho-botton">Home</a>
        <a href="Jogos.html" class="cabeçalho-botton">Jogos</a>
        <a href="#" class="cabeçalho-botton">GameBlog</a>
    </div>

    <!--AREA PRINCIPAL-->
    <div class="lista-favoritos-container">
        
    </div>

    <!-- ÁREA PRINCIPAL DE FAVORITOS -->
<div style="text-align: center; margin-bottom: 40px;">
    <h2 style="font-size: 26px; margin-bottom: 25px;"><span class="vermelho">Meus Favoritos</span></h2>
    
    <!-- O script_2.js renderiza os cards aqui dentro -->
    <div class="caixa" id="lista-favoritos-container"></div>
</div>







    <!-- EASTER EGG CMD E GAME -->
    <div id="cmd-container" class="cmd-escondido">
        <div class="cmd-header">
            <div class="cmd-icon-title">
                <span class="cmd-icon">C:\</span>
                <span class="cmd-titulo">Prompt de Comando</span>
            </div>
            <button id="cmd-fechar" onclick="fecharCMD()">X</button>
        </div>
        <div class="cmd-body" id="cmd-body-area">
            <p class="cmd-mensagem">GameVerse [versão 4.0.4]</p>
            <p class="cmd-mensagem">(c) 2026 GameVerse Corporation. Todos os direitos reservados.</p>
            <br>
            <div id="cmd-historico"></div>
            <div class="cmd-linha-input">
                <span class="cmd-prompt">C:\UserCurioso&gt;</span>
                <input type="text" id="cmd-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

    <div id="game-container" class="cmd-escondido">
        <div class="cmd-header">
            <div class="cmd-icon-title">
                <span class="cmd-icon">🕹️</span>
                <span class="cmd-titulo">Invaders</span>
            </div>
            <button id="cmd-fechar" onclick="fecharJogo()">X</button>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
